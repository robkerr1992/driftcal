version: "3"

vars:
  BINARY: driftcal

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/driftcal

  run:
    desc: Build and run the server
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  test:
    desc: Run all tests
    cmds:
      - go test ./... -race -count=1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  sqlc:
    desc: Generate sqlc code
    cmds:
      - sqlc generate

  migrate-status:
    desc: Show migration status
    cmds:
      - go run ./cmd/driftcal migrate-status
    # Note: will need a small CLI subcommand in a later milestone

  migrate-down:
    desc: Roll back the last migration
    cmds:
      - go run ./cmd/driftcal migrate-down
    # Note: will need a small CLI subcommand in a later milestone

  clean:
    desc: Remove build artifacts and database
    cmds:
      - rm -f {{.BINARY}}
      - rm -f driftcal.db driftcal.db-wal driftcal.db-shm

  build-linux:
    desc: Cross-compile for Linux amd64
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go build -o {{.BINARY}}-linux-amd64 ./cmd/driftcal

  deploy:
    desc: Deploy to VPS (requires REMOTE=user@host)
    deps: [build-linux]
    preconditions:
      - sh: '[ -n "{{.REMOTE}}" ]'
        msg: "REMOTE is required (e.g., task deploy REMOTE=user@host)"
    cmds:
      - scp {{.BINARY}}-linux-amd64 deploy/driftcal.service {{.REMOTE}}:/tmp/
      - ssh {{.REMOTE}} 'sudo mv /tmp/{{.BINARY}}-linux-amd64 /opt/driftcal/{{.BINARY}} && sudo mv /tmp/driftcal.service /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl restart driftcal && sleep 2 && sudo systemctl is-active --quiet driftcal && echo "Deploy successful" || (echo "DEPLOY FAILED - service not running"; sudo journalctl -u driftcal -n 20 --no-pager; exit 1)'
      - |
        echo "Running health check..."
        HEALTH_URL="{{.HEALTH_URL}}"
        if [ -z "$HEALTH_URL" ]; then
          HEALTH_URL="http://{{.REMOTE}}:8080/health"
        fi
        STATUS=$(ssh {{.REMOTE}} "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health" 2>/dev/null)
        if [ "$STATUS" = "200" ]; then
          echo "Health check passed (HTTP $STATUS)"
        else
          echo "HEALTH CHECK FAILED (HTTP $STATUS)"
          exit 1
        fi

  check:
    desc: Run fmt, lint, and test
    cmds:
      - task: fmt
      - task: lint
      - task: test
